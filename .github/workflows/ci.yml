name: CI

# Vérifie chaque pull request : compilation TypeScript et tests.
# Réutilisé par deploy.yml (workflow_call) pour revérifier main avant de déployer.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-et-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Les scripts de test recompilent d'abord (npm run build), puis lancent node --test.
      - name: Compiler
        run: npm run build

      - name: Tests
        run: |
          npm run test:diplomatie
          npm run test:recrutement
          npm run test:parrainage
          npm run test:github
