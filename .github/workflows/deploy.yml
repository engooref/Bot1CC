name: Déploiement

# À chaque fusion dans main : on revérifie le code (même CI que les PR), puis le serveur de
# production est mis à jour par SSH. Le serveur exécute scripts/deploy.sh, qui revient en
# arrière tout seul si la compilation ou le redémarrage échoue.
# Aucun secret dans ce fichier : l'accès vient des secrets de l'environnement « production ».
# Mise en place et dépannage : docs/deploiement.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un seul déploiement à la fois, sans jamais interrompre celui qui est en cours.
concurrency:
  group: deploiement-production
  cancel-in-progress: false

jobs:
  verifier:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deployer:
    needs: verifier
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Préparer l'accès SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # Tolère les maladresses de collage : fins de ligne Windows (CRLF), retours à la ligne
          # perdus (clé sur une seule ligne), ou clé fournie en base64. Le contenu de la clé
          # n'est jamais affiché.
          key="$(printf '%s' "$DEPLOY_SSH_KEY" | tr -d '\r')"
          case "$key" in
            *"BEGIN "*)
              if [ "$(printf '%s\n' "$key" | wc -l)" -le 1 ]; then
                hdr="$(printf '%s' "$key" | grep -o -E -e '-----BEGIN [A-Z ]+-----' || true)"
                ftr="$(printf '%s' "$key" | grep -o -E -e '-----END [A-Z ]+-----' || true)"
                body="$(printf '%s' "$key" | sed -E 's/-----(BEGIN|END) [A-Z ]+-----//g' | tr -d ' \t')"
                key="${hdr}"$'\n'"$(printf '%s' "$body" | fold -w 70)"$'\n'"${ftr}"
              fi ;;
            *) key="$(printf '%s' "$key" | base64 -d 2>/dev/null | tr -d '\r' || true)" ;;
          esac
          printf '%s\n' "$key" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::Le secret DEPLOY_SSH_KEY n'est pas une clé privée SSH lisible (voir docs/deploiement.md)."
            exit 1
          fi
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts

      # La clé ne peut lancer que scripts/deploy.sh (commande forcée côté serveur) :
      # ce qu'on envoie ici n'est que l'identifiant du commit à déployer.
      - name: Déployer le commit ${{ github.sha }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "${GITHUB_SHA}"
